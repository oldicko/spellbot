{% extends "base.html" %}
{% block title %}Grown-ups · spellbot{% endblock %}
{% block body_class %}admin{% endblock %}
{% block body %}
<main id="main" class="wrap narrow">
  <p class="brand"><span class="mark" aria-hidden="true">sp</span> spellbot</p>
  <h1>Grown-ups</h1>
  {% if error %}
    <p class="errors" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/admin/login">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit">Enter</button>
  </form>
  <p class="footer-link"><a href="/">Back to practice</a></p>
</main>
{% endblock %}
